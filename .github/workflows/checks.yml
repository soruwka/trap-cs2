name: Portable checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: C++17 regression tests and project validation
        run: python3 -m unittest discover -s tests -v
